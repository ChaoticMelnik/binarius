name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: binarius
          POSTGRES_PASSWORD: binarius
          POSTGRES_DB: binarius
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U binarius -d binarius"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://binarius:binarius@localhost:5432/binarius
      # the service container runs on the runner's own kernel clock, so the tests may share it
      TEST_DATABASE_URL: postgres://binarius:binarius@localhost:5432/binarius
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
        with:
          # the migration immutability check diffs against the PR base branch
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Schema changes carry a committed migration
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain packages/db/drizzle)" ]; then
            git status --short packages/db/drizzle
            echo "::error::packages/db schema changed without a committed migration (run pnpm db:generate)"
            exit 1
          fi
      - run: pnpm db:check
      - name: Committed migrations are immutable
        env:
          # a pull request compares against its base branch, a push against its own previous
          # commit; github.base_ref is empty on push, and falling back to main there would
          # compare HEAD with itself and pass vacuously
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_REF" ]; then
            git fetch --quiet origin "$BASE_REF"
            base="$(git merge-base "origin/$BASE_REF" HEAD)"
          elif [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            base="$BEFORE_SHA"
          else
            echo "no base revision (first commit) - nothing to compare"
            exit 0
          fi
          # separate statements: an unresolvable base must fail the step, not silently pass
          diff="$(git diff --name-status "$base" HEAD -- 'packages/db/drizzle/*.sql' 'packages/db/drizzle/meta/*_snapshot.json')"
          changed="$(printf '%s\n' "$diff" | grep -vE '^(A|$)' || true)"
          if [ -n "$changed" ]; then
            echo "$changed"
            echo "::error::committed migrations are immutable (forward-only): add a new migration instead"
            exit 1
          fi
          # the journal legitimately grows, so it is compared as a prefix: existing entries
          # must be untouched (the migrator keys on their `when`, and never re-reads the hash)
          if git show "$base:packages/db/drizzle/meta/_journal.json" > /tmp/base_journal.json 2>/dev/null; then
            base_has_journal=1
          else
            # the base predates packages/db entirely: nothing to hold immutable yet
            base_has_journal=0
            echo '{"entries":[]}' > /tmp/base_journal.json
          fi
          BASE_HAS_JOURNAL="$base_has_journal" python3 - <<'PY'
          import json, os, sys
          base = json.load(open('/tmp/base_journal.json'))
          head = json.load(open('packages/db/drizzle/meta/_journal.json'))
          if head['entries'][:len(base['entries'])] != base['entries']:
              print('::error::an already-committed migration journal entry was modified')
              sys.exit(1)
          # only meaningful once the base actually has a journal; comparing against the
          # empty fallback would fail every PR that introduces packages/db
          if os.environ['BASE_HAS_JOURNAL'] == '1':
              for field in ('version', 'dialect'):
                  if base.get(field) != head.get(field):
                      print(f'::error::journal {field} changed: {base.get(field)} -> {head.get(field)}')
                      sys.exit(1)
          appended = len(head['entries']) - len(base['entries'])
          print(f"journal: {len(base['entries'])} existing entries unchanged, {appended} appended")
          PY
      - run: pnpm db:migrate
      - run: pnpm check

  compose:
    runs-on: ubuntu-latest
    env:
      # a crashing service would otherwise be restarted forever and --wait would burn the whole timeout
      COMPOSE_RESTART: 'no'
      # compose refuses to start without these, and none of them has a default a deployment
      # could inherit, so CI supplies its own throwaway values — these eight assignments are
      # fixtures for this job, not configuration anyone ships. TOKEN_ENCRYPTION_KEY_ID and
      # BROKER_PARTNER_REF are not secrets; they are here because they are required, the key id
      # also because the all-zero key is only valid paired with it, and the partner code is one
      # the backend's startup check accepts. TELEGRAM_BOT_TOKEN is required too: the backend reads it
      # (the push after the OAuth callback, #128, never called here) and refuses to start when it
      # equals ADMIN_BOT_TOKEN; the `bot` service is never started.
      # ADMIN_BOT_TOKEN is a fake the staff bot's getMe is refused for: the backend logs that,
      # leaves isPolling() false and keeps serving, which is what this job then checks.
      INTERNAL_API_TOKEN: ci-internal-token-value
      TELEGRAM_BOT_TOKEN: ci-telegram-bot-token
      BROKER_CLIENT_SECRET: ci-broker-client-secret
      TOKEN_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      TOKEN_ENCRYPTION_KEY_ID: dev
      ADMIN_BOT_TOKEN: ci-admin-bot-token
      ADMIN_WEB_TOKEN: ci-admin-web-token-value
      BROKER_PARTNER_REF: ci-partner-ref
    steps:
      - uses: actions/checkout@v4
      - name: Dockerfile Node version matches .node-version
        run: test "$(sed -n 's/^ARG NODE_VERSION=//p' Dockerfile)" = "$(cat .node-version)"
      # the runner's version, printed rather than asserted: the local probes behind these steps
      # ran on a newer Compose, and this is what says which one actually enforced them here
      - run: docker compose version
      - run: docker compose config -q
      # The guard: each required variable must be required on its own, and an empty value has
      # to be refused as well as a missing one — `cp .env.example .env` produces empty ones, and
      # ${VAR?} would accept them while ${VAR:?} does not. One variable at a time, with the other
      # seven supplied, so a default creeping back onto seven of the eight cannot hide behind the
      # eighth. The outer list decides what is tested — a name missing there is simply never
      # checked — and the inner one is what supplies the rest, so a name missing there makes
      # every iteration refuse partly for that reason instead of isolating one variable.
      # (Measured: compose names every missing variable, so the grep below still finds the one
      # under test; the isolation is the point, not the verdict.) Both lists therefore have to
      # name all eight. --env-file /dev/null keeps a developer's own .env out of it locally.
      - name: every required variable is required on its own
        run: |
          set -u
          key=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          for name in INTERNAL_API_TOKEN BROKER_CLIENT_SECRET TOKEN_ENCRYPTION_KEY \
                      TOKEN_ENCRYPTION_KEY_ID TELEGRAM_BOT_TOKEN ADMIN_BOT_TOKEN \
                      ADMIN_WEB_TOKEN BROKER_PARTNER_REF; do
            set --
            for other in INTERNAL_API_TOKEN BROKER_CLIENT_SECRET TOKEN_ENCRYPTION_KEY \
                         TOKEN_ENCRYPTION_KEY_ID TELEGRAM_BOT_TOKEN ADMIN_BOT_TOKEN \
                         ADMIN_WEB_TOKEN BROKER_PARTNER_REF; do
              if [ "$other" = "$name" ]; then continue; fi
              case "$other" in
                TOKEN_ENCRYPTION_KEY) set -- "$@" "TOKEN_ENCRYPTION_KEY=$key" ;;
                TOKEN_ENCRYPTION_KEY_ID) set -- "$@" 'TOKEN_ENCRYPTION_KEY_ID=dev' ;;
                *) set -- "$@" "$other=guard-value" ;;
              esac
            done
            for form in unset empty; do
              if [ "$form" = unset ]; then
                out="$(env -u "$name" "$@" docker compose --env-file /dev/null config -q 2>&1)" \
                  && status=0 || status=$?
              else
                out="$(env "$@" "$name=" docker compose --env-file /dev/null config -q 2>&1)" \
                  && status=0 || status=$?
              fi
              if [ "$status" -eq 0 ]; then
                echo "compose accepted an $form $name" >&2
                exit 1
              fi
              # The wording belongs to compose and changes between versions; what this asserts is
              # that the refusal names this variable. `grep -w` matches on a word boundary, which
              # is what keeps a TOKEN_ENCRYPTION_KEY_ID refusal from counting as evidence for
              # TOKEN_ENCRYPTION_KEY. If compose ever stops printing the name the step fails,
              # which is the safe direction.
              if ! printf '%s' "$out" | grep -qw "$name"; then
                echo "an $form $name was refused for another reason: $out" >&2
                exit 1
              fi
            done
          done
      # #114 renamed ADMIN_PUBLIC_URL to WEB_PUBLIC_URL; an .env still carrying the old name would
      # otherwise give `web` the loopback default and 403 every admin POST. The guard on web's
      # `init` in compose.yaml refuses while the old name is set, even empty; the plain `config -q`
      # above is the check that it stays silent while the name is unset. The job's env supplies
      # the eight required values, so the guard is the only reason left to refuse.
      - name: the renamed ADMIN_PUBLIC_URL is refused
        run: |
          set -u
          for value in https://binarius.example ''; do
            out="$(env ADMIN_PUBLIC_URL="$value" docker compose --env-file /dev/null config -q 2>&1)" \
              && status=0 || status=$?
            if [ "$status" -eq 0 ]; then
              echo "compose accepted ADMIN_PUBLIC_URL='$value'" >&2
              exit 1
            fi
            if ! printf '%s' "$out" | grep -qw ADMIN_PUBLIC_URL; then
              echo "ADMIN_PUBLIC_URL='$value' was refused for another reason: $out" >&2
              exit 1
            fi
          done
      # `bot` is the one service CI never starts, and --wait could not tell us if we did: with
      # the fake token above the bot fails at getMe (401, which grammY does not retry) and the
      # process exits 1, but `dev` is `tsx watch`, whose supervisor survives that and keeps the
      # container running, and `bot` has no healthcheck — so --wait would report success over a
      # dead bot. That supervisor gap is the same in all four app services and is issue #65.
      # The list is derived rather than written out, so a service added to compose.yaml later
      # is started here instead of being silently left behind.
      - name: start every service except bot
        run: |
          services="$(docker compose config --services | grep -v '^bot$' || true)"
          if [ -z "$services" ]; then
            echo "docker compose config --services resolved nothing to start" >&2
            exit 1
          fi
          if printf '%s\n' "$services" | grep -qx bot; then
            echo "the bot service must not be started here (see the comment above)" >&2
            exit 1
          fi
          printf 'starting:%s\n' "$(printf ' %s' $services)"
          docker compose up -d --build --wait --wait-timeout 120 $services
      - run: curl -fsS http://127.0.0.1:3000/health | grep -q '"status":"ok"'
      # `web` has no healthcheck (#70), so --wait treats it as ready the moment the container
      # runs — 0.5 s after `docker compose up`, while `tsx watch` is still compiling. And `dev`
      # is `tsx watch`, whose supervisor survives the app exiting (#65), so --wait would report
      # success over a dead `web` too. This step is what makes the difference: it asks for a
      # page only a listening process can serve, and retries to a deadline rather than racing
      # the compiler. A `web` that never comes up still fails it, which is the whole point.
      - name: the admin pages answer
        run: |
          set -u
          deadline=$((SECONDS + 90))
          until curl -fsS http://127.0.0.1:3001/admin/login | grep -q '<form'; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::the web service never served /admin/login"
              docker compose logs web
              exit 1
            fi
            sleep 2
          done
      # Without this the document and this job would be independent copies of the same procedure,
      # and the step below would keep passing after an edit dropped a command from the document —
      # which is exactly how the procedure came to stop at "create an account" on a volume nothing
      # had migrated. All three greps read only the procedure section, not the whole file: the Accounts
      # section carries the same `staff create` line, so a whole-file grep stayed green when step 6
      # was deleted. The section is the last one in the document, which is what `,$p` relies on —
      # a new section added below it would be read as part of it.
      - name: the document still carries the three commands this job runs
        run: |
          section="$(sed -n '/^## Bringing it up the first time/,$p' docs/staff-login.md)"
          printf '%s' "$section" | grep -qF 'docker compose exec backend pnpm db:migrate' || {
            echo '::error::docs/staff-login.md → Bringing it up lost the migration step this job runs'
            exit 1
          }
          printf '%s' "$section" | grep -qF 'docker compose exec backend pnpm --filter @binarius/backend staff create' || {
            echo '::error::docs/staff-login.md → Bringing it up lost the staff create step this job runs'
            exit 1
          }
          printf '%s' "$section" | grep -qF "curl -fsS http://127.0.0.1:3001/admin/login | grep -q '<form'" || {
            echo '::error::docs/staff-login.md → Bringing it up lost the page probe this job polls with'
            exit 1
          }
      # Steps 4 and 6 of docs/staff-login.md → "Bringing it up the first time", on the fresh volume
      # this job always starts from: --wait reports the backend healthy on an empty database, so
      # without the migration `staff create` fails with `relation "staff" does not exist`. Step 3's
      # log check needs a real token — with the fake one this job uses, the line *is* in the log —
      # and step 5 needs a person. Applying the migrations on container start with fail-fast is #75.
      - name: the first-run procedure creates a staff account on a fresh volume
        run: |
          docker compose exec -T backend pnpm db:migrate
          docker compose exec -T backend pnpm --filter @binarius/backend staff create \
            --login ci-staff --telegram-id 1 | grep -q 'Пароль:'
      - if: failure()
        continue-on-error: true
        run: docker compose logs
      - if: always()
        continue-on-error: true
        run: docker compose down -v
