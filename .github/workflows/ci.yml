name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # test runs before typecheck: typecheck emits dist/, which would mask a broken exports map
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dockerfile Node version matches .node-version
        run: test "$(sed -n 's/^ARG NODE_VERSION=//p' Dockerfile)" = "$(cat .node-version)"
      - run: docker compose config -q
      - run: docker compose up -d --build --wait --wait-timeout 180
      - run: curl -fsS http://127.0.0.1:3000/health | grep -q '"status":"ok"'
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
