name: CI

# Process text, the audit log and docs/process-decisions.md only: no test, script or CI step reads
# them, so a change of these alone runs nothing (#646, #771), except the architect skill:
# tooling/rules-for.test.ts reads its index and rule files (#770). The rest of docs/ is not here -
# tests compare code with it. A pattern after a negated one includes its paths again.
on:
  push:
    branches: [main]
    paths: ['**', '!.claude/**', '!audits.md', '!docs/process-decisions.md', '.claude/skills/architect/**']
  pull_request:
    paths: ['**', '!.claude/**', '!audits.md', '!docs/process-decisions.md', '.claude/skills/architect/**']

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: binarius
          POSTGRES_PASSWORD: binarius
          POSTGRES_DB: binarius
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U binarius -d binarius"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://binarius:binarius@localhost:5432/binarius
      # the service container runs on the runner's own kernel clock, so the tests may share it
      TEST_DATABASE_URL: postgres://binarius:binarius@localhost:5432/binarius
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
        with:
          # the migration immutability check diffs against the PR base branch
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Schema changes carry a committed migration
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain packages/db/drizzle)" ]; then
            git status --short packages/db/drizzle
            echo "::error::packages/db schema changed without a committed migration (run pnpm db:generate)"
            exit 1
          fi
      - run: pnpm db:check
      - name: Committed migrations are immutable
        env:
          # a pull request compares against its base branch, a push against its own previous
          # commit; github.base_ref is empty on push, and falling back to main there would
          # compare HEAD with itself and pass vacuously
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_REF" ]; then
            git fetch --quiet origin "$BASE_REF"
            base="$(git merge-base "origin/$BASE_REF" HEAD)"
          elif [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            base="$BEFORE_SHA"
          else
            echo "no base revision (first commit) - nothing to compare"
            exit 0
          fi
          # separate statements: an unresolvable base must fail the step, not silently pass
          diff="$(git diff --name-status "$base" HEAD -- 'packages/db/drizzle/*.sql' 'packages/db/drizzle/meta/*_snapshot.json')"
          changed="$(printf '%s\n' "$diff" | grep -vE '^(A|$)' || true)"
          if [ -n "$changed" ]; then
            echo "$changed"
            echo "::error::committed migrations are immutable (forward-only): add a new migration instead"
            exit 1
          fi
          # the journal legitimately grows, so it is compared as a prefix: existing entries
          # must be untouched (the migrator keys on their `when`, and never re-reads the hash)
          if git show "$base:packages/db/drizzle/meta/_journal.json" > /tmp/base_journal.json 2>/dev/null; then
            base_has_journal=1
          else
            # the base predates packages/db entirely: nothing to hold immutable yet
            base_has_journal=0
            echo '{"entries":[]}' > /tmp/base_journal.json
          fi
          BASE_HAS_JOURNAL="$base_has_journal" python3 - <<'PY'
          import json, os, sys
          base = json.load(open('/tmp/base_journal.json'))
          head = json.load(open('packages/db/drizzle/meta/_journal.json'))
          if head['entries'][:len(base['entries'])] != base['entries']:
              print('::error::an already-committed migration journal entry was modified')
              sys.exit(1)
          # only meaningful once the base actually has a journal; comparing against the
          # empty fallback would fail every PR that introduces packages/db
          if os.environ['BASE_HAS_JOURNAL'] == '1':
              for field in ('version', 'dialect'):
                  if base.get(field) != head.get(field):
                      print(f'::error::journal {field} changed: {base.get(field)} -> {head.get(field)}')
                      sys.exit(1)
          appended = len(head['entries']) - len(base['entries'])
          print(f"journal: {len(base['entries'])} existing entries unchanged, {appended} appended")
          PY
      - run: pnpm db:migrate
      - run: pnpm check

  compose:
    runs-on: ubuntu-latest
    env:
      # a crashing service would otherwise be restarted forever and --wait would burn the whole timeout
      COMPOSE_RESTART: 'no'
      # The prod profile (#146, docs/deploy.md): every `docker compose` below runs the pair the
      # server runs, the bundles under one node process each. An explicit -f overrides it, which
      # is how the dev file alone is still checked.
      COMPOSE_FILE: compose.yaml:compose.prod.yaml
      # The backup service (#143, docs/backups.md) runs too, on the `local` remote: fixtures of this
      # job, not configuration. /tmp/ci-backups lives inside the container, so every command on it
      # below is an `exec`. The age key pair is made by the step before the start.
      COMPOSE_PROFILES: backup
      RCLONE_CONFIG_BACKUP_TYPE: local
      BACKUP_REMOTE_PATH: /tmp/ci-backups
      BACKUP_ENV_FILE: /tmp/ci-backup-env
      # compose refuses to start without these, and none of them has a default a deployment
      # could inherit, so CI supplies its own throwaway values — these eight assignments are
      # fixtures for this job, not configuration anyone ships. TOKEN_ENCRYPTION_KEY_ID and
      # BROKER_PARTNER_REF are not secrets; they are here because they are required, the key id
      # also because the all-zero key is only valid paired with it, and the partner code is one
      # the backend's startup check accepts. TELEGRAM_BOT_TOKEN is required too: the backend reads it
      # (the push after the OAuth callback, #128, never called here) and refuses to start when it
      # equals ADMIN_BOT_TOKEN; the `bot` service is started only by the last step, where the fake
      # token is the point.
      # ADMIN_BOT_TOKEN is a fake the staff bot's getMe is refused for: the backend logs that,
      # leaves isPolling() false and keeps serving, which is what this job then checks.
      INTERNAL_API_TOKEN: ci-internal-token-value
      TELEGRAM_BOT_TOKEN: ci-telegram-bot-token
      BROKER_CLIENT_SECRET: ci-broker-client-secret
      TOKEN_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      TOKEN_ENCRYPTION_KEY_ID: dev
      ADMIN_BOT_TOKEN: ci-admin-bot-token
      ADMIN_WEB_TOKEN: ci-admin-web-token-value
      BROKER_PARTNER_REF: ci-partner-ref
    steps:
      - uses: actions/checkout@v4
      - name: Dockerfile Node version matches .node-version
        run: test "$(sed -n 's/^ARG NODE_VERSION=//p' Dockerfile)" = "$(cat .node-version)"
      # the runner's version, printed rather than asserted: the local probes behind these steps
      # ran on a newer Compose, and this is what says which one actually enforced them here
      - run: docker compose version
      - run: docker compose -f compose.yaml config -q
      - run: docker compose config -q
      # The dependency on migrate lives in the x-app anchor; a service-level depends_on replaces
      # the whole mapping (bot and web do exactly that), and a successful `up` is no oracle: migrate
      # usually finishes before either tsx process reaches its schema check. So the resolved
      # configuration is asserted, on the runner's own Compose. The one image tag too: a service
      # built from the repository root with its own tag keeps an older journal after a partial
      # `build` (#75, PR #731); a service built from another context (`backup`, tooling/backup)
      # must not take that tag.
      - name: backend and trading-worker start only after migrate, which never restarts, and every service built from the repository root shares one image
        run: |
          config="$(docker compose config --format json)"
          for service in backend trading-worker; do
            condition="$(printf '%s' "$config" | jq -r --arg s "$service" '.services[$s].depends_on.migrate.condition')"
            if [ "$condition" != service_completed_successfully ]; then
              echo "::error::$service does not wait for migrate (depends_on.migrate.condition = $condition)"
              exit 1
            fi
          done
          restart="$(printf '%s' "$config" | jq -r '.services.migrate.restart')"
          if [ "$restart" != no ]; then
            echo "::error::migrate must not restart (restart = $restart)"
            exit 1
          fi
          bad="$(printf '%s' "$config" | jq -r '.name as $p | .services.migrate.build.context as $ctx | .services | to_entries[] | select(.value.build != null) | select((.value.build.context == $ctx) != (.value.image == ($p + "-app"))) | "\(.key)=\(.value.image)"')"
          if [ -n "$bad" ]; then
            echo "::error::services not on the project's one image: $bad"
            exit 1
          fi
      # The guard: each required variable must be required on its own, and an empty value has
      # to be refused as well as a missing one — `cp .env.example .env` produces empty ones, and
      # ${VAR?} would accept them while ${VAR:?} does not. One variable at a time, with the other
      # seven supplied, so a default creeping back onto seven of the eight cannot hide behind the
      # eighth. The outer list decides what is tested — a name missing there is simply never
      # checked — and the inner one is what supplies the rest, so a name missing there makes
      # every iteration refuse partly for that reason instead of isolating one variable.
      # (Measured: compose names every missing variable, so the grep below still finds the one
      # under test; the isolation is the point, not the verdict.) Both lists therefore have to
      # name all eight. --env-file /dev/null keeps a developer's own .env out of it locally.
      - name: every required variable is required on its own
        run: |
          set -u
          key=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          for name in INTERNAL_API_TOKEN BROKER_CLIENT_SECRET TOKEN_ENCRYPTION_KEY \
                      TOKEN_ENCRYPTION_KEY_ID TELEGRAM_BOT_TOKEN ADMIN_BOT_TOKEN \
                      ADMIN_WEB_TOKEN BROKER_PARTNER_REF; do
            set --
            for other in INTERNAL_API_TOKEN BROKER_CLIENT_SECRET TOKEN_ENCRYPTION_KEY \
                         TOKEN_ENCRYPTION_KEY_ID TELEGRAM_BOT_TOKEN ADMIN_BOT_TOKEN \
                         ADMIN_WEB_TOKEN BROKER_PARTNER_REF; do
              if [ "$other" = "$name" ]; then continue; fi
              case "$other" in
                TOKEN_ENCRYPTION_KEY) set -- "$@" "TOKEN_ENCRYPTION_KEY=$key" ;;
                TOKEN_ENCRYPTION_KEY_ID) set -- "$@" 'TOKEN_ENCRYPTION_KEY_ID=dev' ;;
                *) set -- "$@" "$other=guard-value" ;;
              esac
            done
            for form in unset empty; do
              if [ "$form" = unset ]; then
                out="$(env -u "$name" "$@" docker compose --env-file /dev/null config -q 2>&1)" \
                  && status=0 || status=$?
              else
                out="$(env "$@" "$name=" docker compose --env-file /dev/null config -q 2>&1)" \
                  && status=0 || status=$?
              fi
              if [ "$status" -eq 0 ]; then
                echo "compose accepted an $form $name" >&2
                exit 1
              fi
              # The wording belongs to compose and changes between versions; what this asserts is
              # that the refusal names this variable. `grep -w` matches on a word boundary, which
              # is what keeps a TOKEN_ENCRYPTION_KEY_ID refusal from counting as evidence for
              # TOKEN_ENCRYPTION_KEY. If compose ever stops printing the name the step fails,
              # which is the safe direction.
              if ! printf '%s' "$out" | grep -qw "$name"; then
                echo "an $form $name was refused for another reason: $out" >&2
                exit 1
              fi
            done
          done
      # #114 renamed ADMIN_PUBLIC_URL to WEB_PUBLIC_URL; an .env still carrying the old name would
      # otherwise give `web` the loopback default and 403 every admin POST. The guard on web's
      # `init` in compose.yaml refuses while the old name is set, even empty; the plain `config -q`
      # above is the check that it stays silent while the name is unset. The job's env supplies
      # the eight required values, so the guard is the only reason left to refuse.
      - name: the renamed ADMIN_PUBLIC_URL is refused
        run: |
          set -u
          for value in https://binarius.example ''; do
            out="$(env ADMIN_PUBLIC_URL="$value" docker compose --env-file /dev/null config -q 2>&1)" \
              && status=0 || status=$?
            if [ "$status" -eq 0 ]; then
              echo "compose accepted ADMIN_PUBLIC_URL='$value'" >&2
              exit 1
            fi
            if ! printf '%s' "$out" | grep -qw ADMIN_PUBLIC_URL; then
              echo "ADMIN_PUBLIC_URL='$value' was refused for another reason: $out" >&2
              exit 1
            fi
          done
      # What the prod pair changes, on the runner's own Compose: every service compose.yaml runs
      # under `tsx watch` runs its bundle instead (compose.prod.yaml, built by `RUN pnpm build` in
      # the Dockerfile), every service's log rotates at 10m x 3, and postgres and redis restart
      # like the app services. The app list comes from the dev file, so a service added there
      # without a prod command fails here.
      - name: the prod pair runs the bundles and rotates every log
        run: |
          set -u
          dev="$(docker compose -f compose.yaml config --format json)"
          prod="$(docker compose config --format json)"
          apps="$(printf '%s' "$dev" | jq -r '.services | to_entries[] | select(.value.command == ["pnpm", "--filter", "@binarius/\(.key)", "dev"]) | .key')"
          if [ -z "$apps" ]; then
            echo '::error::no service of compose.yaml runs `pnpm --filter @binarius/<service> dev`'
            exit 1
          fi
          for s in $apps; do
            command="$(printf '%s' "$prod" | jq -c --arg s "$s" '.services[$s].command')"
            if [ "$command" != "[\"node\",\"apps/$s/dist/index.js\"]" ]; then
              echo "::error::$s runs $command under the prod pair, expected node apps/$s/dist/index.js"
              exit 1
            fi
          done
          unrotated="$(printf '%s' "$prod" | jq -r '.services | to_entries[] | select(.value.logging.driver != "json-file" or .value.logging.options["max-size"] != "10m" or .value.logging.options["max-file"] != "3") | .key')"
          if [ -n "$unrotated" ]; then
            echo "::error::logs not rotated at 10m x 3: $unrotated"
            exit 1
          fi
          app_restart="$(printf '%s' "$prod" | jq -r '.services.backend.restart')"
          for s in postgres redis; do
            restart="$(printf '%s' "$prod" | jq -r --arg s "$s" '.services[$s].restart')"
            if [ "$restart" != "$app_restart" ]; then
              echo "::error::$s restart = $restart, the app services' = $app_restart"
              exit 1
            fi
          done
      # The backup service's two keys, made with the image's own age-keygen: the recipient
      # encrypts, the identity is what restore-check and restore decrypt with. --progress quiet:
      # with pull_policy: build, `run` builds first and would print BuildKit's log on stdout.
      # The env fixture exists before any container mounts it (a missing bind source would
      # become a directory).
      - name: a throwaway age key pair and the env fixture for the backup service
        run: |
          set -u
          printf 'TOKEN_ENCRYPTION_KEY=%s\n' "$TOKEN_ENCRYPTION_KEY" > /tmp/ci-backup-env
          out="$(docker compose --progress quiet run --rm --no-deps -T backup age-keygen)"
          recipient="$(printf '%s\n' "$out" | sed -n 's/^# public key: //p')"
          identity="$(printf '%s\n' "$out" | grep '^AGE-SECRET-KEY-' || true)"
          if [ -z "$recipient" ] || [ -z "$identity" ]; then
            echo '::error::age-keygen in the backup image printed no key pair'
            exit 1
          fi
          echo "::add-mask::$identity"
          echo "BACKUP_AGE_RECIPIENT=$recipient" >> "$GITHUB_ENV"
          echo "BACKUP_AGE_IDENTITY=$identity" >> "$GITHUB_ENV"
      # `bot` is started by the last step alone, where its exit is the point: with the fake token
      # above it fails at getMe and exits 1, and `bot` has no healthcheck, so --wait here could
      # not tell a dead bot from a live one. Under the prod pair this builds the image with its
      # bundles. The list is derived rather than written out, so a service added to compose.yaml
      # later is started here instead of being silently left behind. It names the one-shot
      # `migrate` too: --wait accepts it once it exited 0 and fails the step when it exited
      # otherwise.
      - name: start every service except bot
        run: |
          services="$(docker compose config --services | grep -v '^bot$' || true)"
          if [ -z "$services" ]; then
            echo "docker compose config --services resolved nothing to start" >&2
            exit 1
          fi
          if printf '%s\n' "$services" | grep -qx bot; then
            echo "the bot service must not be started here (see the comment above)" >&2
            exit 1
          fi
          printf 'starting:%s\n' "$(printf ' %s' $services)"
          docker compose up -d --build --wait --wait-timeout 120 $services
      - run: curl -fsS http://127.0.0.1:3000/health | grep -q '"status":"ok"'
      # `web` has no healthcheck (#65), so --wait treats it as ready the moment the container
      # runs, before the process listens. This step is what makes the difference: it asks for a
      # page only a listening process can serve, and retries to a deadline rather than racing
      # the start. A `web` that never comes up still fails it, which is the whole point.
      - name: the admin pages answer
        run: |
          set -u
          deadline=$((SECONDS + 90))
          until curl -fsS http://127.0.0.1:3001/admin/login | grep -q '<form'; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::the web service never served /admin/login"
              docker compose logs web
              exit 1
            fi
            sleep 2
          done
      # The prod command is one node process under tini (init: true), no pnpm and no tsx: the
      # pilot's memory is the reason (#146), and it is what makes the process's exit the
      # container's. Every service whose resolved command starts with node must be running
      # here, bot aside (the dead-process step below starts it, as the start step says), and is
      # asked for its process list; `ps` is the exec'd one. A service that is not running fails
      # the step: a worker that logged its schema line and then died would pass otherwise.
      - name: every app container runs one node process and nothing else
        run: |
          set -u
          config="$(docker compose config --format json)"
          nodes="$(printf '%s' "$config" | jq -r '.services | to_entries[] | select(.value.command[0]? == "node") | .key' | grep -vx bot || true)"
          if [ -z "$nodes" ]; then
            echo '::error::no service but bot resolves to a node command'
            exit 1
          fi
          running="$(docker compose ps --status running --format '{{.Service}}')"
          for s in $nodes; do
            if ! grep -qx "$s" <<<"$running"; then
              echo "::error::$s is not running: $(docker compose ps -a --format '{{.Status}}' "$s")"
              docker compose logs "$s"
              exit 1
            fi
            got="$(docker compose exec -T "$s" ps -o comm= | sort | tr '\n' ' ')"
            if [ "$got" != 'docker-init node ps ' ]; then
              echo "::error::$s runs more than one node process under tini: $got"
              docker compose exec -T "$s" ps -o pid,ppid,comm
              exit 1
            fi
            echo "$s: $got"
          done
      # The fresh volume this job starts from is what makes `applied` (not `nothing to apply`) the
      # expected line. --wait does not wait for trading-worker (no healthcheck), so its line is
      # polled to a deadline, the same way as the admin pages above. Logs are read into a variable
      # and grepped from a here-string: under pipefail, `grep -q` closing a pipe early would fail
      # the writer with SIGPIPE on a long log.
      - name: the migrate service applied the schema and both processes checked it
        run: |
          set -u
          current='"msg":"database schema is current"'
          logs="$(docker compose logs --no-log-prefix migrate)"
          grep -E '^applied [0-9]+ migrations?:' <<<"$logs" || {
            echo '::error::the migrate service did not apply the migrations'
            printf '%s\n' "$logs"
            exit 1
          }
          grep -qF "$current" <<<"$(docker compose logs --no-log-prefix backend)" || {
            echo '::error::the backend did not log a current schema'
            exit 1
          }
          deadline=$((SECONDS + 60))
          until grep -qF "$current" <<<"$(docker compose logs --no-log-prefix trading-worker)"; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo '::error::the trading-worker never logged a current schema'
              docker compose logs trading-worker
              exit 1
            fi
            sleep 2
          done
      # The schema check in each index.ts, by its exit code: `run --no-deps` starts the service's
      # own prod command (the bundle, which finds packages/db/drizzle from the package's root,
      # not from its own URL) without migrate, against a database nothing migrated, and
      # the one node process leaves with its own code. `timeout` turns a process that never exits
      # into 124 instead of the job's limit.
      - name: a process refuses a database behind its journal
        run: |
          set -u
          docker compose exec -T postgres createdb -U binarius binarius_empty
          empty=postgres://binarius:binarius@postgres:5432/binarius_empty
          for svc in backend trading-worker; do
            out="$(timeout 120 docker compose run --rm --no-deps -T -e DATABASE_URL="$empty" "$svc" \
              </dev/null 2>&1)" && status=0 || status=$?
            if [ "$status" -ne 1 ]; then
              echo "::error::$svc on an empty database exited $status, expected 1"
              printf '%s\n' "$out"
              exit 1
            fi
            grep -qF '"msg":"database schema is behind this image, run the migrations first"' <<<"$out" || {
              echo "::error::$svc exited 1 without the schema line"
              printf '%s\n' "$out"
              exit 1
            }
          done
      # Without this the document and this job would be independent copies of the same procedure,
      # and the step below would keep passing after an edit dropped a command from the document —
      # which is exactly how the procedure came to stop at "create an account" on a volume nothing
      # had migrated. All three greps read only the procedure section, not the whole file: the Accounts
      # section carries the same `staff create` line, so a whole-file grep stayed green when step 6
      # was deleted. The section is the last one in the document, which is what `,$p` relies on —
      # a new section added below it would be read as part of it.
      - name: the document still carries the three commands this job runs
        run: |
          section="$(sed -n '/^## Bringing it up the first time/,$p' docs/staff-login.md)"
          printf '%s' "$section" | grep -qF 'docker compose logs --no-log-prefix migrate' || {
            echo '::error::docs/staff-login.md → Bringing it up lost the migration check this job runs'
            exit 1
          }
          printf '%s' "$section" | grep -qF 'docker compose exec backend pnpm --filter @binarius/backend staff create' || {
            echo '::error::docs/staff-login.md → Bringing it up lost the staff create step this job runs'
            exit 1
          }
          printf '%s' "$section" | grep -qF "curl -fsS http://127.0.0.1:3001/admin/login | grep -q '<form'" || {
            echo '::error::docs/staff-login.md → Bringing it up lost the page probe this job polls with'
            exit 1
          }
      # Step 6 of docs/staff-login.md → "Bringing it up the first time", on the fresh volume this
      # job always starts from: the migrate service applied the schema before the backend started
      # (step 4's line is checked above), so `staff create` finds its table. Step 3's log check
      # needs a real token — with the fake one this job uses, the line *is* in the log — and
      # step 5 needs a person.
      - name: the first-run procedure creates a staff account on a fresh volume
        run: |
          docker compose exec -T backend pnpm --filter @binarius/backend staff create \
            --login ci-staff --telegram-id 1 | grep -q 'Пароль:'
      # The backup service backs up at every start, and --wait above waited for its healthcheck,
      # which only that run's marker satisfies; the line is what says it was a backup.
      - name: the backup service backed up at start
        run: |
          set -u
          logs="$(docker compose logs --no-log-prefix backup)"
          grep -E '^backup ok: binarius-' <<<"$logs" || {
            echo '::error::the backup service logged no backup at start'
            printf '%s\n' "$logs"
            exit 1
          }
      # docs/backups.md -> Checking it by hand, on the real Postgres 18, pg_dump, age and rclone:
      # a backup of the account the step above created, restored into a scratch database and
      # compared with the live one (restore-check prints a row count per table).
      - name: a backup of the first-run data restores into a scratch database
        run: |
          set -u
          out="$(docker compose exec -T backup backup-now)" || true
          printf '%s\n' "$out"
          run="$(printf '%s\n' "$out" | sed -n 's/^backup ok: \(binarius-[0-9TZ]*\),.*/\1/p')"
          if [ -z "$run" ]; then
            echo '::error::backup-now printed no run'
            exit 1
          fi
          echo "BACKUP_RUN=$run" >> "$GITHUB_ENV"
          check="$(docker compose exec -T backup restore-check)" || true
          printf '%s\n' "$check"
          grep -q '^restore-check ok: ' <<<"$check" || {
            echo '::error::restore-check did not pass'
            exit 1
          }
          grep -qx 'rows staff 1' <<<"$check" || {
            echo '::error::the restored database does not hold the one staff account'
            exit 1
          }
      # docs/backups.md -> Restoring, on this job's own stack: the services that hold connections
      # stop, the same run replaces the live database, the services come back on it, and the
      # replaced database is kept under its new name. binarius_empty (the step "a process refuses")
      # does not match either query.
      - name: the same backup restores into the live database
        run: |
          set -u
          docker compose stop backend trading-worker web
          out="$(docker compose exec -T -e BACKUP_RESTORE_CONFIRM="$BACKUP_RUN" backup restore "$BACKUP_RUN")" || true
          printf '%s\n' "$out"
          grep -q '^restore ok: ' <<<"$out" || {
            echo '::error::restore did not replace the live database'
            exit 1
          }
          docker compose up -d --wait --wait-timeout 120 backend trading-worker web
          curl -fsS http://127.0.0.1:3000/health | grep -q '"status":"ok"'
          staff="$(docker compose exec -T postgres psql -U binarius -d binarius -Atc "select count(*) from staff where login = 'ci-staff'")"
          if [ "$staff" != 1 ]; then
            echo "::error::the restored live database holds $staff ci-staff accounts, expected 1"
            exit 1
          fi
          kept="$(docker compose exec -T postgres psql -U binarius -d postgres -Atc "select count(*) from pg_database where datname like 'binarius_before_restore_%'")"
          if [ "$kept" != 1 ]; then
            echo "::error::$kept replaced databases kept, expected 1"
            exit 1
          fi
      # The bot is started here on purpose, with the job's fake token: getMe answers 401, grammY
      # does not retry it, lifecycle.ts logs the failure and calls exit(1). Under the prod command
      # that exit is the container's (one node process under tini, no supervisor), and
      # COMPOSE_RESTART=no leaves it exited instead of restarting. `up --wait` is no oracle for a
      # service without a healthcheck, so the state is read from docker inspect. The log line is
      # asserted too: an import-time failure (a picture or a font the bundle cannot find,
      # apps/bot/src/package-root.ts) also exits 1, but before this line. Under the dev command
      # (`tsx watch`) the container would stay running and this step would fail at the deadline:
      # that gap is #65.
      - name: a dead process ends its container on the prod pair
        run: |
          set -u
          docker compose up -d --no-deps bot
          id="$(docker compose ps -aq bot)"
          deadline=$((SECONDS + 60))
          until [ "$(docker inspect -f '{{.State.Status}} {{.State.ExitCode}}' "$id")" = 'exited 1' ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::the bot container did not exit 1 after a refused getMe: $(docker inspect -f '{{.State.Status}} {{.State.ExitCode}}' "$id")"
              docker compose logs bot
              exit 1
            fi
            sleep 2
          done
          grep -qF 'long polling stopped with an error' <<<"$(docker compose logs --no-log-prefix bot)" || {
            echo '::error::the bot exited 1 without the long polling line'
            docker compose logs bot
            exit 1
          }
      - if: failure()
        continue-on-error: true
        run: docker compose logs
      - if: always()
        continue-on-error: true
        run: docker compose down -v
