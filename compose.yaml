x-app-environment: &app-environment
  DATABASE_URL: postgres://${POSTGRES_USER:-binarius}:${POSTGRES_PASSWORD:-binarius}@postgres:5432/${POSTGRES_DB:-binarius}
  REDIS_URL: redis://redis:6379
  LOG_LEVEL: ${LOG_LEVEL:-info}
  BROKER_CLIENT_ID: ${BROKER_CLIENT_ID:-}
  BROKER_CLIENT_SECRET: ${BROKER_CLIENT_SECRET:-}
  BROKER_WS_URL: ${BROKER_WS_URL:-}

x-app: &app
  build: .
  init: true
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

x-watch-shared: &watch-shared
  path: ./packages/shared/src
  target: /app/packages/shared/src
  action: sync
  initial_sync: true

x-watch-db: &watch-db
  path: ./packages/db/src
  target: /app/packages/db/src
  action: sync
  initial_sync: true

x-rebuild-root-package: &rebuild-root-package
  path: ./package.json
  action: rebuild

x-rebuild-lockfile: &rebuild-lockfile
  path: ./pnpm-lock.yaml
  action: rebuild

x-rebuild-workspace: &rebuild-workspace
  path: ./pnpm-workspace.yaml
  action: rebuild

x-rebuild-tsconfig-base: &rebuild-tsconfig-base
  path: ./tsconfig.base.json
  action: rebuild

x-rebuild-shared-package: &rebuild-shared-package
  path: ./packages/shared/package.json
  action: rebuild

x-rebuild-db-package: &rebuild-db-package
  path: ./packages/db/package.json
  action: rebuild

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-binarius}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-binarius}
      POSTGRES_DB: ${POSTGRES_DB:-binarius}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    <<: *app
    command: pnpm --filter @binarius/backend dev
    environment:
      <<: *app-environment
      PORT: "3000"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3000}:3000"
    healthcheck:
      # 127.0.0.1, not localhost: Alpine resolves localhost to ::1 and the server binds 0.0.0.0
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    develop:
      watch:
        - path: ./apps/backend/src
          target: /app/apps/backend/src
          action: sync
          initial_sync: true
        - *watch-shared
        - *watch-db
        - path: ./apps/backend/package.json
          action: rebuild
        - path: ./apps/backend/tsconfig.json
          action: rebuild
        - *rebuild-shared-package
        - *rebuild-db-package
        - *rebuild-root-package
        - *rebuild-lockfile
        - *rebuild-workspace
        - *rebuild-tsconfig-base

  bot:
    <<: *app
    command: pnpm --filter @binarius/bot dev
    environment:
      <<: *app-environment
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    develop:
      watch:
        - path: ./apps/bot/src
          target: /app/apps/bot/src
          action: sync
          initial_sync: true
        - *watch-shared
        - path: ./apps/bot/package.json
          action: rebuild
        - path: ./apps/bot/tsconfig.json
          action: rebuild
        - *rebuild-shared-package
        - *rebuild-root-package
        - *rebuild-lockfile
        - *rebuild-workspace
        - *rebuild-tsconfig-base

  trading-worker:
    <<: *app
    command: pnpm --filter @binarius/trading-worker dev
    environment:
      <<: *app-environment
    develop:
      watch:
        - path: ./apps/trading-worker/src
          target: /app/apps/trading-worker/src
          action: sync
          initial_sync: true
        - *watch-shared
        - *watch-db
        - path: ./apps/trading-worker/package.json
          action: rebuild
        - path: ./apps/trading-worker/tsconfig.json
          action: rebuild
        - *rebuild-shared-package
        - *rebuild-db-package
        - *rebuild-root-package
        - *rebuild-lockfile
        - *rebuild-workspace
        - *rebuild-tsconfig-base

  web:
    <<: *app
    command: pnpm --filter @binarius/web dev
    environment:
      <<: *app-environment
    develop:
      watch:
        - path: ./apps/web/src
          target: /app/apps/web/src
          action: sync
          initial_sync: true
        - *watch-shared
        - path: ./apps/web/package.json
          action: rebuild
        - path: ./apps/web/tsconfig.json
          action: rebuild
        - *rebuild-shared-package
        - *rebuild-root-package
        - *rebuild-lockfile
        - *rebuild-workspace
        - *rebuild-tsconfig-base

volumes:
  pgdata:
