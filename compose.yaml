x-app-environment: &app-environment
  # the `migrate` service reads the same value through the anchor
  DATABASE_URL: &database-url postgres://${POSTGRES_USER:-binarius}:${POSTGRES_PASSWORD:-binarius}@postgres:5432/${POSTGRES_DB:-binarius}
  REDIS_URL: redis://redis:6379
  LOG_LEVEL: ${LOG_LEVEL:-info}
  HEALTH_TIMEOUT_MS: ${HEALTH_TIMEOUT_MS:-2000}

# valueless entries pass through only when set (shell or .env); ${VAR:-} would inject ""
# shared by the services that talk to the broker; the OAuth credentials are NOT here, because
# only the backend exchanges grants and the worker must never receive the client secret
x-broker-environment: &broker-environment
  BROKER_WS_URL:
  # the REST host: the backend's OAuth exchange and balance reads, the worker's trade lists (#90)
  BROKER_API_BASE_URL: ${BROKER_API_BASE_URL:-https://api.binodex.app}
  # the demo-only fuse (#396): forwarded only when set; true refuses every real intent and real
  # session in this process; see README -> Demo-only stand
  DEMO_ONLY:
  # the stake strategy of new sessions (#450): forwarded only when set; unset is martingale, read
  # by the backend's start route and its `h1 session start` CLI; see docs/stake.md -> Defaults
  SESSION_STAKE_STRATEGY:

# One tag for every service built from this repository (`migrate` names it too), so a partial
# `build` or `up --build <service>` never leaves `migrate` on an older journal (#75, PR #731).
x-app: &app
  build: .
  image: ${COMPOSE_PROJECT_NAME}-app
  init: true
  restart: ${COMPOSE_RESTART:-unless-stopped}
  # Every service built on this anchor opens the database, so none starts before `migrate` has
  # exited 0; a service that replaces depends_on (bot, web) drops this, and the CI compose job
  # asserts the resolved configuration.
  depends_on:
    migrate:
      condition: service_completed_successfully
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

x-watch-shared: &watch-shared
  path: ./packages/shared/src
  target: /app/packages/shared/src
  action: sync

x-watch-db: &watch-db
  path: ./packages/db/src
  target: /app/packages/db/src
  action: sync

# The journal and the SQL, so a process restarted under --watch checks the database against the
# migrations on disk. Nothing applies them on a file write: a generated migration is read before
# it is applied (it can DROP), so `pnpm db:migrate` or `docker compose run --rm --build migrate`.
x-watch-migrations: &watch-migrations
  path: ./packages/db/drizzle
  target: /app/packages/db/drizzle
  action: sync

x-watch-broker-rest: &watch-broker-rest
  path: ./packages/broker-rest/src
  target: /app/packages/broker-rest/src
  action: sync

x-watch-broker-socket: &watch-broker-socket
  path: ./packages/broker-socket/src
  target: /app/packages/broker-socket/src
  action: sync

x-watch-signal: &watch-signal
  path: ./packages/signal/src
  target: /app/packages/signal/src
  action: sync

x-watch-stake: &watch-stake
  path: ./packages/stake/src
  target: /app/packages/stake/src
  action: sync

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-binarius}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-binarius}
      POSTGRES_DB: ${POSTGRES_DB:-binarius}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    # the dead-letter queue and the queued jobs survive a restart (#92); AOF fsyncs every second
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: applies the migrations under an advisory lock (packages/db/src/cli/migrate.ts) and
  # exits; backend and trading-worker wait for its exit 0. Not built on x-app: that anchor's
  # restart policy would loop a finished one-shot (and hang `up`), and its depends_on names this
  # service itself. It still shares the anchor's image tag, so a partial build never leaves it on
  # an older journal.
  migrate:
    build: .
    image: ${COMPOSE_PROJECT_NAME}-app
    init: true
    restart: "no"
    command: pnpm db:migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: *database-url

  backend:
    <<: *app
    command: pnpm --filter @binarius/backend dev
    # above both shutdown phases (10 s + 4 s, apps/backend/src/timing.ts): a SIGTERM during a
    # publish waits for the row in flight instead of killing it mid-transaction
    stop_grace_period: 20s
    environment:
      <<: [*app-environment, *broker-environment]
      PORT: "3000"
      # no default on purpose: a value here is one a deployment inherits by accident
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set it in .env; see .env.example}
      # OAuth login (#9). These stay on `backend` rather than the shared broker anchor: the
      # worker never exchanges grants and must not receive the client secret or the key that
      # decrypts stored tokens. The URLs and the client id carry dev defaults; the client
      # secret, the key, its id and the partner code do not, so the stack stops until they are
      # set. A made-up partner code would not fail loudly: every new account would silently
      # register outside the partner account, and #162's email login answers it with a 400. In
      # CI they come from the workflow's env block.
      BROKER_CLIENT_ID: ${BROKER_CLIENT_ID:-binarius-dev-client}
      BROKER_CLIENT_SECRET: ${BROKER_CLIENT_SECRET:?set it in .env; see .env.example}
      # the anchor gives `web` the same default: its login page navigates only to this URL
      BROKER_OAUTH_AUTHORIZE_URL: &broker-authorize-url ${BROKER_OAUTH_AUTHORIZE_URL:-https://binodex.app/oauth/authorize}
      # the pairs catalog's refresh period, 30000-60000; forwarded only when set, code default
      # otherwise (docs/pairs-catalog.md)
      BROKER_PAIRS_TTL_MS:
      # the broker balance refresh: interval 10000-60000 and GETs per minute 1-500; forwarded only
      # when set, code defaults otherwise (docs/broker-balance.md)
      BALANCE_RECONCILE_INTERVAL_MS:
      BALANCE_POLL_MAX_PER_MINUTE:
      # the signal REST's chart GETs per minute (the analysis without the socket's window, the
      # candle backfill; the candle scanner is gone since #828): 25-200; forwarded only when set,
      # code default otherwise (docs/signal.md -> The budget)
      SIGNAL_SCAN_MAX_PER_MINUTE:
      # The broker redirects to the callback page `web` serves, so the default is WEB_PUBLIC_URL
      # plus that page's path (tied by apps/web/src/timing.test.ts). A login completes only when
      # the value equals <WEB_PUBLIC_URL>/oauth/callback of this deployment: the page forwards to
      # this stack's backend. Set it only to match the spelling registered with the broker — the
      # backend sends it byte for byte — never to point elsewhere.
      BROKER_OAUTH_REDIRECT_URI: ${BROKER_OAUTH_REDIRECT_URI:-${WEB_PUBLIC_URL:-http://127.0.0.1:3001}/oauth/callback}
      BROKER_PARTNER_REF: ${BROKER_PARTNER_REF:?set it in .env; see .env.example}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?set it in .env; see .env.example}
      TOKEN_ENCRYPTION_KEY_ID: ${TOKEN_ENCRYPTION_KEY_ID:?set it in .env; see .env.example}
      # The public bot's token, for the one sendMessage after the OAuth callback (#128) and for
      # the `bot-text` CLI publishing the command menu and the profile (#301). The backend never
      # polls it — the `bot` service is its one poller — and refuses to start when it equals
      # ADMIN_BOT_TOKEN.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set it in .env; see .env.example}
      # Staff login (#68). The bot is a second grammY instance inside this process, on its own
      # token: two pollers on one token fight over getUpdates. The web token is a narrow
      # bearer that opens /admin/* and nothing else. Neither has a default — a value here is
      # one a deployment inherits by accident.
      ADMIN_BOT_TOKEN: ${ADMIN_BOT_TOKEN:?set it in .env; see .env.example}
      ADMIN_WEB_TOKEN: ${ADMIN_WEB_TOKEN:?set it in .env; see .env.example}
      # the link the staff bot sends is <WEB_PUBLIC_URL>/admin/login/link/<token> (#448): the
      # same value and default as `web` below, tied by apps/backend/src/timing.test.ts
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-http://127.0.0.1:3001}
      # The broker's postbacks (#141, docs/postbacks.md): the secret path segment of
      # GET /postbacks/binodex/<secret>. Forwarded only when set; unset, the route does not exist.
      # Here rather than in the broker anchor: the worker never receives it.
      POSTBACK_URL_SECRET:
      # The H1 driver's wait for the worker's take (#707, docs/h1.md -> The driver): 700 ms unless
      # set. Forwarded only when set; here rather than in the broker anchor: the worker never reads it.
      H1_SUBMIT_BUDGET_MS:
      # The cashier widget's origins (#11, docs/deposit.md). Forwarded only when set; unset, the
      # backend allows the origin of BROKER_OAUTH_AUTHORIZE_URL alone. `web` below reads the same
      # line (#111): the two lists must be one, tied by both processes' timing.test.ts.
      DEPOSIT_WIDGET_ORIGINS:
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3000}:3000"
    healthcheck:
      # 127.0.0.1, not localhost: Alpine resolves localhost to ::1 and the server binds 0.0.0.0
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      # above the HEALTH_TIMEOUT_MS ceiling (2500): the probe sees the app's verdict, not a killed check
      timeout: 3s
      retries: 5
      start_period: 20s
    develop:
      watch:
        - path: ./apps/backend/src
          target: /app/apps/backend/src
          action: sync
        - *watch-shared
        - *watch-db
        - *watch-migrations
        - *watch-broker-rest
        - *watch-broker-socket
        - *watch-signal
        - *watch-stake
        - path: ./apps/backend/package.json
          action: rebuild
        - path: ./apps/backend/tsconfig.json
          action: rebuild
        - path: ./packages/broker-rest/package.json
          action: rebuild
        - path: ./packages/broker-rest/tsconfig.json
          action: rebuild
        - path: ./packages/broker-socket/package.json
          action: rebuild
        - path: ./packages/broker-socket/tsconfig.json
          action: rebuild
        - path: ./packages/signal/package.json
          action: rebuild
        - path: ./packages/signal/tsconfig.json
          action: rebuild
        - path: ./packages/stake/package.json
          action: rebuild
        - path: ./packages/stake/tsconfig.json
          action: rebuild
        - path: ./packages/shared/package.json
          action: rebuild
        - path: ./packages/shared/tsconfig.json
          action: rebuild
        - path: ./packages/db/package.json
          action: rebuild
        - path: ./packages/db/tsconfig.json
          action: rebuild
        - path: ./package.json
          action: rebuild
        - path: ./pnpm-lock.yaml
          action: rebuild
        - path: ./pnpm-workspace.yaml
          action: rebuild
        - path: ./tsconfig.base.json
          action: rebuild

  bot:
    <<: *app
    command: pnpm --filter @binarius/bot dev
    # replaces the anchor's list: the bot talks to the backend and to nothing else, and the
    # backend already waits for postgres and redis itself
    depends_on:
      backend:
        condition: service_healthy
    # above the bot's shutdown budget (50 s, apps/bot/src/timing.ts): a SIGTERM lets the update
    # in flight finish instead of killing it mid-handler
    stop_grace_period: 55s
    # not the shared anchor: env.ts reads exactly these seven names, and the Postgres password
    # and the Redis URL have no business inside a process that never opens either connection
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # no default on purpose: a value here is one a deployment inherits by accident
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set it in .env; see .env.example}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set it in .env; see .env.example}
      BACKEND_URL: http://backend:3000
      # valueless: the welcome video is optional and passes through only when set
      WELCOME_VIDEO_FILE_ID:
      # valueless: the promo card's storage channel (#538) is optional; without it, no «📤 Поделиться»
      SHARE_STORAGE_CHAT_ID:
      # the cashier's origin for «💳 Пополнить» (#27): web's value, tied by a test; https only, the
      # bot shows no button on any other
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-http://127.0.0.1:3001}
    develop:
      watch:
        - path: ./apps/bot/src
          target: /app/apps/bot/src
          action: sync
        - *watch-shared
        - path: ./apps/bot/package.json
          action: rebuild
        - path: ./apps/bot/tsconfig.json
          action: rebuild
        - path: ./packages/shared/package.json
          action: rebuild
        - path: ./packages/shared/tsconfig.json
          action: rebuild
        - path: ./package.json
          action: rebuild
        - path: ./pnpm-lock.yaml
          action: rebuild
        - path: ./pnpm-workspace.yaml
          action: rebuild
        - path: ./tsconfig.base.json
          action: rebuild

  trading-worker:
    <<: *app
    command: pnpm --filter @binarius/trading-worker dev
    # above the worker's shutdown budget (35 s), which itself covers the longest submit ack
    # timeout (30 s): a deploy waits for a job in flight instead of killing it mid-write
    stop_grace_period: 40s
    # the worker processes (#94, docs/worker-capacity.md): 1 until #815 partitions the loops and
    # scripts/deploy-worker.sh rolls more than one
    deploy:
      replicas: ${TRADING_WORKER_REPLICAS:-1}
    environment:
      <<: [*app-environment, *broker-environment]
      # optional tunables, forwarded only when set (code defaults otherwise)
      INTENT_MAX_AGE_MS:
      SUBMIT_ACK_TIMEOUT_MS:
      WORKER_CONCURRENCY:
      MAX_SESSIONS_PER_WORKER:
      # the circuit breaker's thresholds (#96, docs/runbook-broker-outage.md)
      CIRCUIT_BREAKER_WINDOW_MS:
      CIRCUIT_BREAKER_MIN_FAILURES:
      CIRCUIT_BREAKER_FAILURE_PERCENT:
      # the token route (#90): the worker asks the backend for a broker access token behind the
      # internal bearer. No depends_on for it: the reconciler and the catch-up retry until the
      # backend answers.
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set it in .env; see .env.example}
      BACKEND_URL: http://backend:3000
    develop:
      watch:
        - path: ./apps/trading-worker/src
          target: /app/apps/trading-worker/src
          action: sync
        - *watch-shared
        - *watch-db
        - *watch-migrations
        - *watch-broker-rest
        - *watch-broker-socket
        - *watch-signal
        - *watch-stake
        - path: ./apps/trading-worker/package.json
          action: rebuild
        - path: ./apps/trading-worker/tsconfig.json
          action: rebuild
        - path: ./packages/broker-rest/package.json
          action: rebuild
        - path: ./packages/broker-rest/tsconfig.json
          action: rebuild
        - path: ./packages/broker-socket/package.json
          action: rebuild
        - path: ./packages/broker-socket/tsconfig.json
          action: rebuild
        - path: ./packages/signal/package.json
          action: rebuild
        - path: ./packages/signal/tsconfig.json
          action: rebuild
        - path: ./packages/stake/package.json
          action: rebuild
        - path: ./packages/stake/tsconfig.json
          action: rebuild
        - path: ./packages/shared/package.json
          action: rebuild
        - path: ./packages/shared/tsconfig.json
          action: rebuild
        - path: ./packages/db/package.json
          action: rebuild
        - path: ./packages/db/tsconfig.json
          action: rebuild
        - path: ./package.json
          action: rebuild
        - path: ./pnpm-lock.yaml
          action: rebuild
        - path: ./pnpm-workspace.yaml
          action: rebuild
        - path: ./tsconfig.base.json
          action: rebuild

  web:
    <<: *app
    command: pnpm --filter @binarius/web dev
    # replaces the anchor's list: these pages hold no database or queue connection, and the
    # backend already waits for postgres and redis itself
    depends_on:
      backend:
        condition: service_healthy
    # above the web shutdown budget (11 s, apps/web/src/timing.ts): a SIGTERM lets the request
    # in flight finish its one backend call instead of cutting a login in half
    stop_grace_period: 14s
    # The anchor's `init: true`, restated as a guard for the name #114 renamed: while
    # ADMIN_PUBLIC_URL is set in .env or the shell (even empty), the value stops being a boolean
    # and compose refuses at interpolation with the message, instead of handing `web` the
    # loopback default. Not `${ADMIN_PUBLIC_URL+${X:?message}}`: Compose 2.38 evaluates the
    # nested `:?` even when ADMIN_PUBLIC_URL is unset, which would refuse every run. The CI
    # compose job checks the refusal; the message must not contain " #" (a YAML comment) or "}".
    init: ${ADMIN_PUBLIC_URL+ADMIN_PUBLIC_URL was renamed to WEB_PUBLIC_URL in issue 114, rename it in .env - }true
    # Not the shared anchor: env.ts reads exactly these seven names, and DATABASE_URL and
    # REDIS_URL have no business in a process that never opens either connection — everything
    # it may read is decided by a staff session the backend checks (docs/staff-login.md).
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: "3000"
      BACKEND_URL: http://backend:3000
      ADMIN_WEB_TOKEN: ${ADMIN_WEB_TOKEN:?set it in .env; see .env.example}
      # the origin the pages are served from: a POST's Origin header must equal it, and the
      # broker redirects back to it. Change it together with WEB_PORT below: the two defaults
      # are tied by apps/web/src/timing.test.ts, because a mismatch makes every form submission
      # a 403. Spelled exactly scheme://host[:port] - no whitespace, control or invisible format
      # characters, `/`, `?`, `#`, `\`, `%`, `@` or dot-segments (.env.example -> WEB_PUBLIC_URL):
      # the redirect default above is this value plus a path.
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-http://127.0.0.1:3001}
      BROKER_OAUTH_AUTHORIZE_URL: *broker-authorize-url
      # the cashier page's frame-src and its check of the backend's widget origin (#111): the
      # backend's value, forwarded only when set; unset, both default to the authorize origin
      DEPOSIT_WIDGET_ORIGINS:
    ports:
      - "127.0.0.1:${WEB_PORT:-3001}:3000"
    develop:
      watch:
        - path: ./apps/web/src
          target: /app/apps/web/src
          action: sync
        - *watch-shared
        - path: ./apps/web/package.json
          action: rebuild
        - path: ./apps/web/tsconfig.json
          action: rebuild
        - path: ./packages/shared/package.json
          action: rebuild
        - path: ./packages/shared/tsconfig.json
          action: rebuild
        - path: ./package.json
          action: rebuild
        - path: ./pnpm-lock.yaml
          action: rebuild
        - path: ./pnpm-workspace.yaml
          action: rebuild
        - path: ./tsconfig.base.json
          action: rebuild

volumes:
  pgdata:
  redisdata:
