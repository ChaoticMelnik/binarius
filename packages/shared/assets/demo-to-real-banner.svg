<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <!-- The demo-to-real chain's banner (#880, docs/mailing.md → The demo-to-real chain): no words,
       so one file for both languages; the help banner's palette (help-banner.svg). The demo, a
       dashed tile of hollow candles going both ways, leads to the deposit, a solid tile with a
       wallet and a coin: a step, not a result, so no line goes up.
       PNG: node tooling/demo-to-real-banner.ts -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1A3A"/>
      <stop offset="1" stop-color="#112A55"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#275CA8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#275CA8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#ground)"/>
  <ellipse cx="640" cy="320" rx="620" ry="300" fill="url(#glow)"/>
  <g stroke="#1B4686" stroke-width="2" fill="none" opacity="0.6">
    <circle cx="640" cy="320" r="270"/>
    <circle cx="640" cy="320" r="350" stroke-dasharray="8 12"/>
  </g>
  <!-- the demo: a dashed tile, hollow candles up and down -->
  <g transform="translate(400 320)">
    <rect x="-130" y="-130" width="260" height="260" rx="52" fill="#0E2246" stroke="#4F7FC4" stroke-width="5" stroke-dasharray="18 14"/>
    <g fill="none" stroke="#7FA6DD" stroke-width="5" stroke-linecap="round">
      <path d="M-66 -58 V-36 M-66 20 V46 M-22 -70 V-50 M-22 10 V30 M22 -40 V-18 M22 46 V70 M66 -62 V-44 M66 14 V40"/>
      <g stroke-dasharray="10 8">
        <rect x="-80" y="-36" width="28" height="56" rx="4"/>
        <rect x="-36" y="-50" width="28" height="60" rx="4"/>
        <rect x="8" y="-18" width="28" height="64" rx="4"/>
        <rect x="52" y="-44" width="28" height="58" rx="4"/>
      </g>
    </g>
  </g>
  <!-- the step: an arrow from the demo to the deposit -->
  <g stroke="#39FF6A" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="568" y1="320" x2="700" y2="320"/>
    <path d="M668 284 L708 320 L668 356"/>
  </g>
  <!-- the deposit: a solid tile, a wallet and a coin going in -->
  <g transform="translate(880 320)">
    <rect x="-130" y="-130" width="260" height="260" rx="52" fill="#11294F" stroke="#F0C05A" stroke-width="5"/>
    <circle cx="0" cy="-62" r="34" fill="#F0C05A" stroke="#FFF0B0" stroke-width="5"/>
    <circle cx="0" cy="-62" r="18" fill="none" stroke="#C99A35" stroke-width="5"/>
    <rect x="-78" y="-20" width="156" height="104" rx="20" fill="#39FF6A"/>
    <rect x="-78" y="-20" width="156" height="26" rx="12" fill="#2AC05E"/>
    <rect x="30" y="20" width="56" height="40" rx="12" fill="#2AC05E"/>
    <circle cx="52" cy="40" r="8" fill="#0B1A3A"/>
  </g>
  <g fill="#F0C05A">
    <circle cx="180" cy="140" r="5"/>
    <circle cx="1110" cy="510" r="5"/>
    <circle cx="1080" cy="120" r="4" fill="#39FF6A"/>
    <circle cx="200" cy="500" r="4" fill="#39FF6A"/>
  </g>
</svg>
